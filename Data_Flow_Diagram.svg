<svg viewBox="0 0 940 1240" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="1240" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Veridata — End-to-End Data Flow</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#6b7280">Alur proses dari upload dataset hingga monitoring berkelanjutan</text>

  <!-- Step boxes definitions: x=200 width=480 -->
  <!-- Step 1 -->
  <g>
    <rect x="200" y="80" width="480" height="76" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="230" y="106" font-size="13" font-weight="bold" fill="#111827">1. Upload Dataset</text>
    <text x="230" y="124" font-size="11" fill="#374151">CSV / XLSX / koneksi database (Fase 2)</text>
    <text x="230" y="140" font-size="11" fill="#374151">Pengguna mengunggah atau menghubungkan sumber data</text>
  </g>
  <line x1="440" y1="156" x2="440" y2="188" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 2 -->
  <g>
    <rect x="200" y="190" width="480" height="76" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="230" y="216" font-size="13" font-weight="bold" fill="#111827">2. Ingestion &amp; Parsing</text>
    <text x="230" y="234" font-size="11" fill="#374151">Deteksi delimiter, encoding, tipe data per kolom</text>
    <text x="230" y="250" font-size="11" fill="#374151">Validasi awal file (format, kolom kosong total, dsb)</text>
  </g>
  <line x1="440" y1="266" x2="440" y2="298" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 3 -->
  <g>
    <rect x="200" y="300" width="480" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="230" y="326" font-size="13" font-weight="bold" fill="#111827">3. Automated Profiling</text>
    <text x="230" y="344" font-size="11" fill="#374151">Statistik kolom, % null, distribusi, skor kualitas awal</text>
  </g>
  <line x1="440" y1="376" x2="440" y2="408" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 4 -->
  <g>
    <rect x="200" y="410" width="480" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="230" y="436" font-size="13" font-weight="bold" fill="#111827">4. Rule Application</text>
    <text x="230" y="454" font-size="11" fill="#374151">Validity &amp; business rule (bawaan + custom) +</text>
    <text x="230" y="470" font-size="11" fill="#374151">rule hasil generate AI dari bahasa natural</text>
  </g>
  <line x1="440" y1="486" x2="440" y2="518" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 5 -->
  <g>
    <rect x="200" y="520" width="480" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="230" y="546" font-size="13" font-weight="bold" fill="#111827">5. Entity Resolution &amp; Clustering</text>
    <text x="230" y="564" font-size="11" fill="#374151">Blocking key + fuzzy similarity → skor pasangan (RecordMatchScore),</text>
    <text x="230" y="580" font-size="11" fill="#374151">dikelompokkan (union-find) jadi cluster ber-cluster_id (bisa &gt;2 record)</text>
  </g>
  <line x1="440" y1="596" x2="440" y2="628" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 6 -->
  <g>
    <rect x="200" y="630" width="480" height="76" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="230" y="656" font-size="13" font-weight="bold" fill="#111827">6. Human Review (per Cluster)</text>
    <text x="230" y="674" font-size="11" fill="#374151">Analyst konfirmasi/split/gabung cluster (bukan cuma sepasang),</text>
    <text x="230" y="690" font-size="11" fill="#374151">selesaikan kasus ambigu lewat review queue</text>
  </g>
  <line x1="440" y1="706" x2="440" y2="738" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 7 -->
  <g>
    <rect x="200" y="740" width="480" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="230" y="766" font-size="13" font-weight="bold" fill="#111827">7. Golden Record Generation</text>
    <text x="230" y="784" font-size="11" fill="#374151">1 golden record per cluster_id, survivorship rule + audit trail</text>
  </g>
  <line x1="440" y1="816" x2="440" y2="848" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 8 -->
  <g>
    <rect x="200" y="850" width="480" height="76" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="230" y="876" font-size="13" font-weight="bold" fill="#111827">8. Quality Scorecard Generation</text>
    <text x="230" y="894" font-size="11" fill="#374151">Skor per dimensi: completeness, validity, uniqueness, dsb</text>
  </g>
  <line x1="440" y1="926" x2="440" y2="958" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 9 -->
  <g>
    <rect x="200" y="960" width="480" height="76" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="230" y="986" font-size="13" font-weight="bold" fill="#111827">9. Export / API Delivery</text>
    <text x="230" y="1004" font-size="11" fill="#374151">PDF/CSV export, atau kirim ke sistem downstream via API</text>
  </g>
  <line x1="440" y1="1036" x2="440" y2="1068" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 10 -->
  <g>
    <rect x="200" y="1070" width="480" height="86" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="230" y="1096" font-size="13" font-weight="bold" fill="#111827">10. Continuous Monitoring</text>
    <text x="230" y="1114" font-size="11" fill="#374151">Re-profiling terjadwal, deteksi drift kualitas data,</text>
    <text x="230" y="1130" font-size="11" fill="#374151">kirim alert bila melewati threshold</text>
  </g>

  <!-- Alert branch box -->
  <rect x="720" y="1082" width="180" height="62" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="810" y="1106" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Alert</text>
  <text x="810" y="1122" text-anchor="middle" font-size="10" fill="#374151">Email / Slack / Webhook</text>
  <line x1="680" y1="1105" x2="712" y2="1105" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <text x="696" y="1097" text-anchor="middle" font-size="9" fill="#b91c1c">jika &gt; threshold</text>

  <!-- Feedback loop from step 10 back to step 3 -->
  <path d="M 200 1105 C 60 1105, 60 340, 200 335" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowLoop)"/>
  <text x="40" y="720" font-size="11" fill="#b91c1c" transform="rotate(-90 40 720)" text-anchor="middle">Loop: re-profiling terjadwal &amp; drift detection</text>

  <text x="470" y="1210" text-anchor="middle" font-size="11" fill="#9ca3af">Veridata — Data Flow Diagram v0.1 · Lampiran PRD Data Quality &amp; Entity Resolution Platform</text>
</svg>
