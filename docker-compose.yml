services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dataklin
      POSTGRES_PASSWORD: dataklin
      POSTGRES_DB: dataklin
    ports:
      - "5432:5432"
    volumes:
      - ./docker_data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataklin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./docker_data/redisdata:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"   # host 9010 -> minio 9000 (9000 dipakai clickhouse di mesin dev)
      - "9011:9001"
    volumes:
      - ./docker_data/miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://dataklin:dataklin@dataklin-postgres-1:5432/dataklin
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
      # Kunci dev saja — generate ulang untuk produksi (lihat .env.example)
      ENCRYPTION_KEY: nbnabpQ3JJHhYHbflUaR2Bof65FneqFrThjlGqEmB8Y=
    ports:
      - "8005:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://dataklin:dataklin@dataklin-postgres-1:5432/dataklin
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
      # Kunci dev saja — generate ulang untuk produksi (lihat .env.example)
      ENCRYPTION_KEY: nbnabpQ3JJHhYHbflUaR2Bof65FneqFrThjlGqEmB8Y=
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: rq worker dataqc --url redis://redis:6379/0

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"   # web UI untuk lihat email yang "terkirim" saat dev
      - "1025:1025"   # SMTP

  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://dataklin:dataklin@dataklin-postgres-1:5432/dataklin
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
    command: rqscheduler --url redis://redis:6379/0 --interval 30

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3005:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
